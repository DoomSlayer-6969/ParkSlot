<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ParkSlot — Book a parking slot</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="logo">P</span> ParkSlot</a>
    <div id="auth-area" class="auth-area"></div>
  </header>

  <main class="layout">
    <aside class="panel">
      <form id="search-form" class="search">
        <input id="search-input" type="search" placeholder="Where are you going?" aria-label="Destination">
        <button class="btn primary">Search</button>
        <button type="button" id="locate-btn" class="btn ghost" title="Use my location" aria-label="Use my location">◎</button>
      </form>
      <p class="muted small">Or click anywhere on the map to look for parking around that point.</p>

      <div class="window">
        <label>Arrive from <input type="datetime-local" id="start-input"></label>
        <label>Hours <input type="number" id="hours-input" min="1" max="24" step="1" value="1"></label>
      </div>

      <section id="results" aria-live="polite"></section>
    </aside>

    <div id="map" aria-label="Map of parking spots"></div>
  </main>

  <dialog id="modal">
    <button class="modal-close" id="modal-close" aria-label="Close">×</button>
    <div id="modal-body"></div>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="app.js"></script>
</body>
</html>
