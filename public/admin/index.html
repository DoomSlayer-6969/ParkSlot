<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ParkSlot Admin</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="admin">
  <header class="topbar">
    <a class="brand" href="/admin/"><span class="logo">P</span> ParkSlot <span class="portal-tag">Admin</span></a>
    <div id="admin-auth" class="auth-area"></div>
  </header>

  <main>
    <section id="login-view" class="narrow" hidden>
      <form id="login-form" class="form card">
        <h1>Admin sign in</h1>
        <p class="muted small">For parking staff. Drivers book at the <a href="/">ParkSlot app</a>.</p>
        <label>Email <input name="email" type="email" required autocomplete="username"></label>
        <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
        <p class="error" id="login-error"></p>
        <div class="actions"><button class="btn primary">Sign in</button></div>
      </form>
    </section>

    <section id="app-view" class="admin-main" hidden>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-panel="checkin" aria-selected="true">Check-in</button>
        <button class="tab" role="tab" data-panel="bookings" aria-selected="false">Bookings</button>
      </div>

      <div id="checkin-panel" class="narrow-left">
        <form id="checkin-form" class="form card">
          <h1>Check a driver in</h1>
          <p class="muted small">Enter the booking ID the driver shows on arrival.</p>
          <label>Booking ID <input name="code" required placeholder="PK-XXXX-XXXX" autocomplete="off" class="code-input"></label>
          <div class="actions"><button class="btn primary">Check in</button></div>
        </form>
        <div id="checkin-result" aria-live="polite"></div>
      </div>

      <div id="bookings-panel" hidden>
        <form id="booking-search" class="filters">
          <input name="q" type="search" placeholder="Booking ID, driver name or email" aria-label="Search bookings">
          <select name="scope" aria-label="Which bookings">
            <option value="all">All bookings</option>
            <option value="upcoming">Upcoming &amp; active</option>
            <option value="history">Past (paid)</option>
          </select>
          <button class="btn primary">Search</button>
        </form>
        <div class="table-wrap">
          <table class="bookings-table">
            <thead>
              <tr><th>Booking</th><th>Driver</th><th>Spot · slot</th><th>Window</th><th>Amount</th><th>Status</th></tr>
            </thead>
            <tbody id="bookings-body"></tbody>
          </table>
        </div>
        <p class="muted" id="bookings-status"></p>
        <div class="actions"><button class="btn ghost" id="load-more" hidden>Load more</button></div>
      </div>
    </section>
  </main>

  <dialog id="modal">
    <button class="modal-close" id="modal-close" aria-label="Close">×</button>
    <div id="modal-body"></div>
  </dialog>

  <script type="module" src="admin.js"></script>
</body>
</html>
